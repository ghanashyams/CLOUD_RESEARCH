<svg xmlns="http://www.w3.org/2000/svg" width="740" height="440" viewBox="0 0 740 440" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="740" height="440" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">Two CASB modes — how it inspects traffic</text>

  <!-- INLINE -->
  <text x="20" y="60" font-size="13" font-weight="700" fill="#1d4ed8">INLINE (proxy) — real-time, in-path, PREVENTS</text>
  <g>
    <rect x="20" y="72" width="120" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="80" y="91" font-size="11" fill="#334155" text-anchor="middle">User /</text>
    <text x="80" y="106" font-size="11" fill="#334155" text-anchor="middle">BYOD device</text>

    <rect x="200" y="72" width="150" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="275" y="90" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">CASB proxy</text>
    <text x="275" y="107" font-size="10" fill="#3b82f6" text-anchor="middle">decrypt + scan inline</text>

    <rect x="410" y="72" width="150" height="46" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
    <text x="485" y="91" font-size="11" fill="#0e7490" text-anchor="middle">SaaS app</text>
    <text x="485" y="106" font-size="10" fill="#155e75" text-anchor="middle">(e.g. G Drive)</text>

    <line x1="140" y1="95" x2="198" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <line x1="350" y1="95" x2="408" y2="95" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="275" y="140" font-size="10.5" fill="#dc2626" text-anchor="middle">traffic flows THROUGH proxy → can block upload/download in real time</text>
  </g>

  <line x1="20" y1="165" x2="720" y2="165" stroke="#e2e8f0" stroke-width="1"/>

  <!-- API -->
  <text x="20" y="195" font-size="13" font-weight="700" fill="#7c3aed">API / INTROSPECTION (out-of-band) — post-hoc, REMEDIATES</text>
  <g>
    <rect x="20" y="210" width="120" height="46" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
    <text x="80" y="229" font-size="11" fill="#334155" text-anchor="middle">User /</text>
    <text x="80" y="244" font-size="11" fill="#334155" text-anchor="middle">sync client</text>

    <rect x="410" y="210" width="150" height="46" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
    <text x="485" y="229" font-size="11" fill="#0e7490" text-anchor="middle">SaaS app</text>
    <text x="485" y="244" font-size="10" fill="#155e75" text-anchor="middle">(e.g. G Drive)</text>

    <line x1="140" y1="233" x2="408" y2="233" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
    <text x="274" y="224" font-size="10" fill="#64748b" text-anchor="middle">traffic goes DIRECT (bypasses CASB)</text>

    <rect x="410" y="300" width="150" height="70" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
    <text x="485" y="326" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">CASB (API)</text>
    <text x="485" y="345" font-size="10" fill="#6d28d9" text-anchor="middle">OAuth to tenant</text>
    <text x="485" y="360" font-size="10" fill="#6d28d9" text-anchor="middle">scan + remediate</text>

    <!-- webhook + pull -->
    <path d="M485 256 L485 298" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arwd)"/>
    <text x="600" y="280" font-size="10" fill="#94a3b8" text-anchor="middle">1. webhook fires</text>
    <text x="600" y="296" font-size="10" fill="#94a3b8" text-anchor="middle">2. CASB pulls file via API</text>
    <text x="600" y="312" font-size="10" fill="#94a3b8" text-anchor="middle">3. scans in its cloud</text>
    <text x="600" y="328" font-size="10" fill="#94a3b8" text-anchor="middle">4. remediates (quarantine/</text>
    <text x="600" y="344" font-size="10" fill="#94a3b8" text-anchor="middle">   unshare/delete)</text>

    <text x="274" y="345" font-size="10.5" fill="#7c3aed" text-anchor="middle">file already landed → scanned AFTER the fact</text>
  </g>

  <text x="20" y="410" font-size="11" fill="#475569">Inline sees only proxy-steered traffic (blocks in real time). API sees the WHOLE tenant incl. bypass traffic</text>
  <text x="20" y="428" font-size="11" fill="#475569">(cert-pinned sync clients, native apps, internal sharing, files already there) — but only post-hoc. You need BOTH.</text>
</svg>
