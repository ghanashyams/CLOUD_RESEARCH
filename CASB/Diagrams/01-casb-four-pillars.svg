<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="230" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">CASB — the four pillars (what it DOES)</text>
  <text x="20" y="50" font-size="11" fill="#64748b">A security control point between users and cloud/SaaS apps. Delivered via inline + API modes.</text>

  <rect x="20" y="70" width="165" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="102" y="98" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">1. Visibility</text>
  <text x="102" y="122" font-size="10.5" fill="#3b82f6" text-anchor="middle">see which apps</text>
  <text x="102" y="138" font-size="10.5" fill="#3b82f6" text-anchor="middle">are used, by whom</text>
  <text x="102" y="154" font-size="10.5" fill="#3b82f6" text-anchor="middle">shadow IT discovery</text>
  <text x="102" y="176" font-size="10" fill="#94a3b8" text-anchor="middle">(AVC lives here)</text>

  <rect x="197" y="70" width="165" height="140" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="279" y="98" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">2. Data Security</text>
  <text x="279" y="122" font-size="10.5" fill="#059669" text-anchor="middle">DLP</text>
  <text x="279" y="138" font-size="10.5" fill="#059669" text-anchor="middle">prevent leakage</text>
  <text x="279" y="154" font-size="10.5" fill="#059669" text-anchor="middle">control upload/</text>
  <text x="279" y="170" font-size="10.5" fill="#059669" text-anchor="middle">download/share</text>

  <rect x="374" y="70" width="165" height="140" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
  <text x="456" y="98" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">3. Threat Protection</text>
  <text x="456" y="122" font-size="10.5" fill="#dc2626" text-anchor="middle">malware scanning</text>
  <text x="456" y="138" font-size="10.5" fill="#dc2626" text-anchor="middle">account takeover</text>
  <text x="456" y="154" font-size="10.5" fill="#dc2626" text-anchor="middle">risky behavior</text>

  <rect x="551" y="70" width="149" height="140" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="625" y="98" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">4. Compliance</text>
  <text x="625" y="122" font-size="10.5" fill="#d97706" text-anchor="middle">data residency</text>
  <text x="625" y="138" font-size="10.5" fill="#d97706" text-anchor="middle">access controls</text>
  <text x="625" y="154" font-size="10.5" fill="#d97706" text-anchor="middle">audit / policy</text>
</svg>
