<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#0f172a">CASB is one component of SSE / SASE</text>
  <text x="20" y="50" font-size="11" fill="#64748b">SSE = the security half of SASE. CASB is the cloud-app-governance piece, sharing the same PoP/proxy + API infrastructure.</text>

  <rect x="20" y="70" width="680" height="160" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="40" y="94" font-size="13" font-weight="700" fill="#334155">SSE platform (Netskope, Cisco Secure Access, Zscaler...)</text>

  <rect x="45" y="110" width="150" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="120" y="136" font-size="13" font-weight="700" fill="#1d4ed8" text-anchor="middle">CASB</text>
  <text x="120" y="158" font-size="10" fill="#3b82f6" text-anchor="middle">cloud-app</text>
  <text x="120" y="173" font-size="10" fill="#3b82f6" text-anchor="middle">governance</text>
  <text x="120" y="193" font-size="9.5" fill="#94a3b8" text-anchor="middle">inline + API modes</text>

  <rect x="210" y="110" width="150" height="100" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="285" y="136" font-size="13" font-weight="700" fill="#047857" text-anchor="middle">SWG</text>
  <text x="285" y="158" font-size="10" fill="#059669" text-anchor="middle">secure web</text>
  <text x="285" y="173" font-size="10" fill="#059669" text-anchor="middle">gateway (proxy)</text>

  <rect x="375" y="110" width="150" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="450" y="136" font-size="13" font-weight="700" fill="#b45309" text-anchor="middle">ZTNA</text>
  <text x="450" y="158" font-size="10" fill="#d97706" text-anchor="middle">zero-trust</text>
  <text x="450" y="173" font-size="10" fill="#d97706" text-anchor="middle">app access</text>

  <rect x="540" y="110" width="140" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="610" y="136" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">FWaaS</text>
  <text x="610" y="158" font-size="10" fill="#dc2626" text-anchor="middle">firewall</text>
  <text x="610" y="173" font-size="10" fill="#dc2626" text-anchor="middle">as a service</text>
</svg>
