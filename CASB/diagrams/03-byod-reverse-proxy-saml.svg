<svg xmlns="http://www.w3.org/2000/svg" width="740" height="330" viewBox="0 0 740 330" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="740" height="330" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="700" fill="#0f172a">BYOD via reverse proxy — SAML chaining inserts the CASB inline</text>

  <rect x="20" y="60" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="85" y="80" font-size="11" fill="#334155" text-anchor="middle">BYOD device</text>
  <text x="85" y="96" font-size="10" fill="#64748b" text-anchor="middle">(browser, no agent)</text>

  <rect x="300" y="60" width="130" height="50" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="365" y="80" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">Corporate IdP</text>
  <text x="365" y="96" font-size="10" fill="#d97706" text-anchor="middle">SAML (Okta/Entra)</text>

  <rect x="300" y="170" width="130" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="365" y="192" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">CASB reverse</text>
  <text x="365" y="208" font-size="12" font-weight="700" fill="#1d4ed8" text-anchor="middle">proxy (inline)</text>

  <rect x="580" y="170" width="130" height="56" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.2"/>
  <text x="645" y="192" font-size="11" fill="#0e7490" text-anchor="middle">Corporate</text>
  <text x="645" y="208" font-size="11" fill="#0e7490" text-anchor="middle">G Drive</text>

  <!-- flow -->
  <line x1="150" y1="78" x2="298" y2="82" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="220" y="70" font-size="10" fill="#64748b" text-anchor="middle">1. login (SAML)</text>

  <path d="M365 110 L365 168" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="470" y="142" font-size="10" fill="#64748b" text-anchor="middle">2. SAML redirects session</text>
  <text x="470" y="156" font-size="10" fill="#64748b" text-anchor="middle">THROUGH the CASB proxy</text>

  <line x1="430" y1="198" x2="578" y2="198" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="504" y="190" font-size="10" fill="#64748b" text-anchor="middle">3. proxied to Drive</text>

  <path d="M300 210 Q160 210 150 108" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="150" y="150" font-size="10" fill="#64748b" text-anchor="middle">4. all session</text>
  <text x="150" y="164" font-size="10" fill="#64748b" text-anchor="middle">traffic now flows</text>
  <text x="150" y="178" font-size="10" fill="#64748b" text-anchor="middle">through proxy</text>

  <rect x="120" y="250" width="500" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="370" y="272" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">At the proxy (inline): TLS decrypt → DLP + malware scan on upload/download</text>
  <text x="370" y="292" font-size="10.5" fill="#dc2626" text-anchor="middle">block sensitive download to unmanaged device / block malware upload — in real time</text>

  <text x="20" y="325" font-size="10" fill="#94a3b8">Gap: a native app on the same phone uses direct token-based, cert-pinned traffic → bypasses this proxy → caught by API introspection instead.</text>
</svg>
