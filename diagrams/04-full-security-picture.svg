<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#ffffff"/>
  <text x="380" y="28" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Full security picture — two pipelines, converge, respond</text>

  <!-- cluster signals -->
  <rect x="30" y="150" width="160" height="300" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="110" y="174" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">EKS cluster</text>
  <text x="110" y="190" font-size="10.5" fill="#64748b" text-anchor="middle">signals</text>
  <rect x="48" y="210" width="124" height="70" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.2"/>
  <text x="110" y="232" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">behavior</text>
  <text x="110" y="249" font-size="9.5" fill="#059669" text-anchor="middle">flow, DNS, CloudTrail,</text>
  <text x="110" y="263" font-size="9.5" fill="#059669" text-anchor="middle">EKS audit, runtime</text>
  <rect x="48" y="390" width="124" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="110" y="412" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">config state</text>
  <text x="110" y="429" font-size="9.5" fill="#3b82f6" text-anchor="middle">IAM policies,</text>
  <text x="110" y="443" font-size="9.5" fill="#3b82f6" text-anchor="middle">resource config</text>

  <!-- threat pipeline -->
  <rect x="250" y="196" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="340" y="222" font-size="13" font-weight="700" fill="#b91c1c" text-anchor="middle">GuardDuty</text>
  <text x="340" y="242" font-size="10" fill="#dc2626" text-anchor="middle">THREAT DETECTION</text>
  <text x="340" y="260" font-size="10" fill="#ef4444" text-anchor="middle">behavior → findings</text>
  <text x="340" y="278" font-size="10" fill="#ef4444" text-anchor="middle">"burglar in the house"</text>

  <!-- posture pipeline -->
  <rect x="250" y="378" width="180" height="96" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="340" y="402" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Access Analyzer</text>
  <text x="340" y="420" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">+ AWS Config</text>
  <text x="340" y="440" font-size="10" fill="#d97706" text-anchor="middle">POSTURE / CSPM</text>
  <text x="340" y="458" font-size="10" fill="#d97706" text-anchor="middle">config → misconfig findings</text>

  <line x1="172" y1="245" x2="248" y2="240" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="172" y1="425" x2="248" y2="428" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- security hub -->
  <rect x="480" y="288" width="180" height="94" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="570" y="314" font-size="13" font-weight="700" fill="#5b21b6" text-anchor="middle">Security Hub</text>
  <text x="570" y="336" font-size="10" fill="#6d28d9" text-anchor="middle">aggregates all findings</text>
  <text x="570" y="354" font-size="10" fill="#6d28d9" text-anchor="middle">CIS benchmarks, scoring</text>

  <line x1="430" y1="252" x2="478" y2="305" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="430" y1="420" x2="478" y2="362" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- eventbridge -->
  <rect x="480" y="404" width="180" height="52" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/>
  <text x="570" y="424" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">EventBridge</text>
  <text x="570" y="443" font-size="10" fill="#155e75" text-anchor="middle">routes on finding</text>
  <line x1="570" y1="382" x2="570" y2="402" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- response -->
  <rect x="405" y="490" width="150" height="70" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="480" y="512" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="middle">Lambda</text>
  <text x="480" y="531" font-size="10" fill="#e11d48" text-anchor="middle">auto-remediate</text>
  <text x="480" y="547" font-size="10" fill="#e11d48" text-anchor="middle">isolate / revoke</text>
  <rect x="585" y="490" width="150" height="70" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.3"/>
  <text x="660" y="512" font-size="12.5" font-weight="700" fill="#9d174d" text-anchor="middle">SNS</text>
  <text x="660" y="531" font-size="10" fill="#db2777" text-anchor="middle">alert SOC</text>
  <text x="660" y="547" font-size="10" fill="#db2777" text-anchor="middle">ticket / page</text>
  <line x1="545" y1="456" x2="500" y2="488" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="595" y1="456" x2="640" y2="488" stroke="#475569" stroke-width="1.5" marker-end="url(#arw)"/>

  <text x="340" y="512" font-size="10.5" fill="#64748b" text-anchor="middle">behavior = threat detection</text>
  <text x="340" y="528" font-size="10.5" fill="#64748b" text-anchor="middle">config = posture</text>
  <text x="340" y="544" font-size="10.5" fill="#64748b" text-anchor="middle">both needed — defense in depth</text>
</svg>
